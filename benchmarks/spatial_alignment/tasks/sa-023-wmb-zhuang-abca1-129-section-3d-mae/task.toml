# NOT COMPARABLE, SUPERSEDED BY sa-414 (2026-09-25). Kept as built; exclude its scores from results tables.
# Input and truth use Allen CCF (x, y) in mm. For these coronal sections CCF x is anterior-posterior
# depth (sd ~0.02 mm within a section), so agents align a side-on strip, not the section plane, and
# the in-plane left-right axis (CCF z) is absent from the input, so rescoring cannot repair it.
# SABench publishes no MAE for Data99-227 (only Supplementary Fig. 3c, no source data), so there
# is no published number to match. sa-414 is the corrected task on the same 129 sections and
# 3,698,530 cells: raw section coordinates as input, CCF in-plane (z, y) in µm as truth.
